[project]
name = "cadenza-stoller-hall"
version = "0.1.0"
description = "Operator-led experiment presentation for Stoller Hall"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6", "PyYAML>=6"]

[project.scripts]
cadenza = "cadenza.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
cadenza = ["qml/*.qml"]
